<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nghệ sĩ - ArtGallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="navbar-dark">
    <div id="premium-bg"></div>
    <div id="loader-overlay"><div class="loader-spinner"></div></div>

    <nav id="main-navbar" class="navbar navbar-expand-lg fixed-top navbar-custom">
      <div class="container-fluid px-3 px-md-5">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <i class="fas fa-gem me-2" style="color: var(--gold-main)"></i> ArtGallery
        </a>

        <div class="collapse navbar-collapse justify-content-center">
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Khám phá</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="artists.html">Nghệ sĩ</a>
            </li>
          </ul>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div id="authNavArea" class="d-flex align-items-center gap-2"></div>
          <a
            id="adminNavLink"
            href="auth.html?redirect=admin.html"
            class="btn btn-outline-gold d-flex align-items-center gap-2"
          >
            <i class="fas fa-user"></i> Quản trị
          </a>
        </div>
      </div>
    </nav>

    <main class="artists-page pt-5 mt-5">
      <div class="container-fluid px-3 px-md-5 pb-5">
        <header class="artists-page-header mb-4 mb-md-5">
          <p class="text-secondary small mb-2" style="letter-spacing: 2px">COLLECTION</p>
          <h1 class="artists-page-title mb-2">Nghệ sĩ</h1>
          <p class="text-secondary mb-4" style="max-width: 560px">
            Tổng hợp họa sĩ và các tác phẩm đã được duyệt. Bấm vào tác phẩm để xem chi tiết.
          </p>

          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-6 col-lg-4">
              <div class="position-relative search-box">
                <i
                  class="fas fa-search position-absolute top-50 translate-middle-y text-secondary"
                  style="left: 1rem"
                ></i>
                <input
                  type="text"
                  id="artistSearchInput"
                  class="form-control shadow-none"
                  placeholder="Tìm nghệ sĩ..."
                />
              </div>
            </div>
            <div class="col-auto">
              <span class="text-secondary small">
                <i class="fas fa-users me-1" style="color: var(--gold-text)"></i>
                <span id="stat-artist-count">0</span> nghệ sĩ ·
                <span id="stat-artwork-count">0</span> tác phẩm
              </span>
            </div>
          </div>
        </header>

        <div id="artists-container"></div>
      </div>
    </main>

    <div class="modal fade" id="artworkModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content glass-panel border-0">
          <div class="modal-body p-0">
            <button
              type="button"
              class="btn-close btn-close-white position-absolute top-0 end-0 m-4 z-3"
              data-bs-dismiss="modal"
            ></button>
            <div class="row g-0">
              <div class="col-lg-7 bg-black">
                <img id="modalImage" src="" class="img-fluid w-100 modal-img-left" alt="" />
              </div>
              <div class="col-lg-5 p-5 d-flex flex-column justify-content-center">
                <span
                  id="modalStyle"
                  class="style-tag style-tag-default mb-3 align-self-start"
                ></span>
                <h2 id="modalTitle" class="fw-bold mb-3 display-6"></h2>
                <p class="text-light opacity-75 small mb-4">
                  <i class="fas fa-clock me-1"></i> Đăng ngày:
                  <span id="modalDate" class="text-white fw-semibold"></span>
                </p>
                <p id="modalDesc" class="text-light opacity-75 lh-lg fs-6 mb-5"></p>

                <div class="d-flex align-items-center mt-auto p-4 glass-panel rounded-4">
                  <img
                    id="modalArtistAvatar"
                    src=""
                    class="rounded-circle avatar-glow me-3"
                    width="60"
                    height="60"
                    alt=""
                  />
                  <div>
                    <h5 class="mb-1 fw-bold text-light" id="modalArtistName"></h5>
                    <small class="text-primary fw-semibold">Nghệ sĩ độc quyền</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.auth) return;
        const area = document.getElementById("authNavArea");
        if (!area) return;

        const u = window.auth.getCurrentUser();
        const adminLink = document.getElementById("adminNavLink");
        if (adminLink) {
          adminLink.setAttribute(
            "href",
            u && u.role === "admin" ? "admin.html" : "auth.html?redirect=admin.html"
          );
        }
        if (!u) {
          area.innerHTML = `<a href="auth.html?redirect=artists.html" class="btn btn-outline-gold d-flex align-items-center gap-2">
            <i class="fas fa-right-to-bracket"></i> Đăng nhập
          </a>`;
          return;
        }

        area.innerHTML = `
          <span class="text-secondary small d-none d-lg-inline">Xin chào, <strong style="color: var(--gold-text)">${u.username}</strong></span>
          <button class="btn btn-outline-gold d-flex align-items-center gap-2" id="btnLogout" type="button">
            <i class="fas fa-arrow-right-from-bracket"></i> Thoát
          </button>
        `;
        document.getElementById("btnLogout")?.addEventListener("click", function () {
          window.auth.logout();
          window.location.reload();
        });
      });
    </script>
    <script src="js/api.js"></script>
    <script src="js/style-tags.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/artists-page.js"></script>
  </body>
</html>
