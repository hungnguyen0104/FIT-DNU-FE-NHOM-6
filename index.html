<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtGallery - Nền tảng Nghệ thuật Cao cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="navbar-dark">
    <!-- Lớp nền siêu cao cấp (Chỉ hiện ra khi có ánh sáng chuột rọi vào) -->
    <div id="premium-bg"></div>
    <div id="loader-overlay">
        <div class="loader-spinner"></div>
    </div>



    <!-- ==========================================
         THANH ĐIỀU HƯỚNG (NAVBAR) CHUẨN RESPONSIVE
         ========================================== -->
    <div class="hero-wrapper">
        <nav id="main-navbar" class="navbar navbar-expand-lg fixed-top navbar-custom">
            <div class="container-fluid px-5">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <i class="fas fa-gem me-2" style="color: var(--gold-main)"></i> ArtGallery
                </a>

                <div class="collapse navbar-collapse justify-content-center">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Khám phá</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="artists.html">Nghệ sĩ</a>
                        </li>
                    </ul>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <div class="position-relative search-box">
                        <i class="fas fa-search position-absolute top-50 translate-middle-y text-secondary" style="left: 1rem"></i>
                        <input type="text" id="searchInput" class="form-control shadow-none" placeholder="Tìm kiếm tác phẩm" />
                    </div>
                    <div id="authNavArea" class="d-flex align-items-center gap-2"></div>
                    <a id="adminNavLink" href="auth.html?redirect=admin.html" class="btn btn-outline-gold d-flex align-items-center gap-2">
                        <i class="fas fa-user"></i> Quản trị
                    </a>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-5 position-relative">
            <div class="row">
                <div class="col-md-7 hero-text-area ps-md-5">
                    <h1 class="title-kham-pha">Khám phá</h1>
                    <div class="d-flex align-items-baseline gap-3">
                        <span class="title-nghe-thuat">Nghệ thuật</span>
                        <span class="title-dich-thuc">Đích thực</span>
                    </div>
                    <p class="subtitle-text">
                        Nền tảng trưng bày và sưu tầm các tác phẩm nghệ thuật kỹ thuật số cao cấp từ những nghệ sĩ hàng đầu.
                    </p>

                    <div id="filter-container" class="d-flex flex-wrap gap-3 mt-4">
                        <button class="filter-btn active" data-filter="All">
                <i class="fas fa-star me-1" style="font-size: 10px"></i> Tất cả
              </button>
                        <button class="filter-btn" data-filter="Trừu tượng">
                Trừu tượng
              </button>
                        <button class="filter-btn" data-filter="Hiện đại">
                Hiện đại
              </button>
                        <button class="filter-btn" data-filter="Cổ điển">Cổ điển</button>
                        <button class="filter-btn" data-filter="Tối giản">
                Tối giản
              </button>
                        <button class="filter-btn text-warning" id="sortLikesBtn" style="border-color: rgba(212, 175, 55, 0.4) !important;">
    <i class="fas fa-fire me-1"></i> Hot nhất
</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="vertical-text-container">
            <span class="vertical-text">FEATURED</span>
            <span style="color: var(--gold-main); font-size: 0.8rem">01</span>
            <div style="
              width: 1px;
              height: 30px;
              background-color: var(--border-gold);
            "></div>
        </div>
    </div>

    <div class="gallery-slider-wrapper px-md-5">
        <div class="gallery-slider" id="gallery-container"></div>
    </div>
    </div>

    <div class="modal fade" id="artworkModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content glass-panel border-0">
                <div class="modal-body p-0">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-4 z-3" data-bs-dismiss="modal"></button>
                    <div class="row g-0">
                        <div class="col-lg-7 bg-black">
                            <img id="modalImage" src="" class="img-fluid w-100 modal-img-left" alt="" />
                        </div>
                        <div class="col-lg-5 p-5 d-flex flex-column justify-content-center">
                            <span id="modalStyle" class="style-tag style-tag-default mb-3 align-self-start"></span>
                            <h2 id="modalTitle" class="fw-bold mb-3 display-6"></h2>
                            <p class="text-light opacity-75 small mb-4">
                                <i class="fas fa-clock me-1"></i> Đăng ngày:
                                <span id="modalDate" class="text-white fw-semibold"></span>
                            </p>
                            <p id="modalDesc" class="text-light opacity-75 lh-lg fs-6 mb-5"></p>

                            <div class="d-flex align-items-center mt-auto p-4 glass-panel rounded-4">
                                <img id="modalArtistAvatar" src="" class="rounded-circle avatar-glow me-3" width="60" height="60" />
                                <div>
                                    <h5 class="mb-1 fw-bold text-light" id="modalArtistName"></h5>
                                    <small class="text-primary fw-semibold">Nghệ sĩ độc quyền</small
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="loginRequiredModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div
          class="modal-content border-0 text-center p-4"
          style="
            background: #121212;
            border: 1px solid rgba(212, 175, 55, 0.3) !important;
            border-radius: 16px;
          "
        >
          <div class="mb-2">
            <i class="fas fa-lock" style="color: var(--gold-main); font-size: 2rem"></i>
          </div>
          <h5 class="text-white fw-bold mb-0" style="font-family: var(--font-serif)">
            Cần đăng nhập
          </h5>
          <div class="d-flex justify-content-center gap-2 mt-4">
            <button
              type="button"
              class="btn btn-sm rounded-pill px-4"
              style="color: white; border: 1px solid rgba(255, 255, 255, 0.2)"
              data-bs-dismiss="modal"
            >
              Để sau
            </button>
            <a class="btn btn-outline-gold btn-sm rounded-pill px-4" href="auth.html?redirect=index.html">
              Đăng nhập
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- jquery -->
    <!-- Nhúng thư viện jQuery  -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- custom js -->
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.auth) return;
        const area = document.getElementById("authNavArea");
        if (!area) return;

        const u = window.auth.getCurrentUser();
        const adminLink = document.getElementById("adminNavLink");
        if (adminLink) {
          if (u && u.role === "admin") {
            adminLink.setAttribute("href", "admin.html");
          } else {
            adminLink.setAttribute("href", "auth.html?redirect=admin.html");
          }
        }
        if (!u) {
          area.innerHTML = `<a href="auth.html?redirect=index.html" class="btn btn-outline-gold d-flex align-items-center gap-2">
            <i class="fas fa-right-to-bracket"></i> Đăng nhập
          </a>`;
          return;
        }

        area.innerHTML = `
          <span class="text-secondary small d-none d-lg-inline">Xin chào, <strong style="color: var(--gold-text)">${u.username}</strong></span>
          <button class="btn btn-outline-gold d-flex align-items-center gap-2" id="btnLogout" type="button">
            <i class="fas fa-arrow-right-from-bracket"></i> Thoát
          </button>
        `;
        const btn = document.getElementById("btnLogout");
        if (btn) {
          btn.addEventListener("click", function () {
            window.auth.logout();
            window.location.reload();
          });
        }
      });
    </script>
    <script src="js/api.js"></script>
    <script src="js/style-tags.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
