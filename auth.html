<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - ArtGallery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="auth-page navbar-dark">
    <div id="loader-overlay"><div class="loader-spinner"></div></div>

    <header class="auth-topbar">
      <a class="auth-topbar-brand" href="index.html">
        <i class="fas fa-gem"></i>
        <span>ArtGallery</span>
      </a>
      <a class="auth-topbar-home" href="index.html">
        <i class="fas fa-arrow-left"></i>
        <span class="d-none d-sm-inline">Trang chủ</span>
      </a>
    </header>

    <main class="auth-portal">
      <div class="auth-portal-card">
        <div class="auth-portal-glow" aria-hidden="true"></div>

        <div class="auth-portal-header">
          <div class="auth-portal-emblem" aria-hidden="true">
            <i class="fas fa-gem"></i>
          </div>
          <p class="auth-portal-eyebrow">MEMBER ACCESS</p>
          <h1 class="auth-portal-title">Cổng thành viên</h1>
        </div>

        <div class="auth-tab-switch" role="tablist" aria-label="Chọn đăng nhập hoặc đăng ký">
          <button
            type="button"
            class="auth-tab active"
            id="tab-login"
            role="tab"
            aria-selected="true"
            aria-controls="panel-login"
            data-auth-tab="login"
          >
            Đăng nhập
          </button>
          <button
            type="button"
            class="auth-tab"
            id="tab-register"
            role="tab"
            aria-selected="false"
            aria-controls="panel-register"
            data-auth-tab="register"
          >
            Đăng ký
          </button>
          <span class="auth-tab-indicator" id="authTabIndicator" aria-hidden="true"></span>
        </div>

        <div id="authAlert" class="auth-alert d-none" role="alert"></div>

        <div class="auth-panels">
          <div id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
            <form id="loginForm" class="auth-form">
              <div class="auth-field">
                <i class="fas fa-user auth-field-icon" aria-hidden="true"></i>
                <input
                  type="text"
                  class="auth-input"
                  id="loginUsername"
                  placeholder="Tên đăng nhập"
                  required
                  autocomplete="username"
                />
              </div>
              <div class="auth-field">
                <i class="fas fa-lock auth-field-icon" aria-hidden="true"></i>
                <input
                  type="password"
                  class="auth-input"
                  id="loginPassword"
                  placeholder="Mật khẩu"
                  required
                  autocomplete="current-password"
                />
              </div>
              <button type="submit" class="auth-submit">
                <span>Vào phòng triển lãm</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
              </button>
            </form>
          </div>

          <div
            id="panel-register"
            class="auth-panel d-none"
            role="tabpanel"
            aria-labelledby="tab-register"
          >
            <form id="registerForm" class="auth-form">
              <div class="auth-field">
                <i class="fas fa-user auth-field-icon" aria-hidden="true"></i>
                <input
                  type="text"
                  class="auth-input"
                  id="registerUsername"
                  placeholder="Tên đăng nhập"
                  required
                  autocomplete="username"
                />
              </div>
              <div class="auth-field">
                <i class="fas fa-lock auth-field-icon" aria-hidden="true"></i>
                <input
                  type="password"
                  class="auth-input"
                  id="registerPassword"
                  placeholder="Mật khẩu"
                  required
                  autocomplete="new-password"
                />
              </div>
              <div class="auth-field">
                <i class="fas fa-shield-halved auth-field-icon" aria-hidden="true"></i>
                <input
                  type="password"
                  class="auth-input"
                  id="registerPassword2"
                  placeholder="Nhập lại mật khẩu"
                  required
                  autocomplete="new-password"
                />
              </div>
              <button type="submit" class="auth-submit">
                <span>Đăng ký thành viên</span>
                <i class="fas fa-user-plus" aria-hidden="true"></i>
              </button>
            </form>
          </div>
        </div>

        <footer class="auth-portal-footer">
          <span class="auth-portal-footer-line" aria-hidden="true"></span>
          <span class="auth-portal-footer-text">Bảo tàng nghệ thuật số</span>
          <span class="auth-portal-footer-line" aria-hidden="true"></span>
        </footer>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-page.js"></script>
  </body>
</html>
